trigger:
- azure-pipelines-Staging

pool:
  vmImage: 'ubuntu-latest'

steps:
# 🟢 Step 1: Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '18.x'

- script: |
    echo "Installing Puppeteer dependencies (Ubuntu 22+/24+ compatible)..."
    sudo apt-get update
    sudo apt-get install -y \
      libx11-xcb1 \
      libxcomposite1 \
      libxcursor1 \
      libxdamage1 \
      libxi6 \
      libxtst6 \
      libnss3 \
      libxrandr2 \
      libatk1.0-0 \
      libatk-bridge2.0-0 \
      libdrm2 \
      libgbm1 \
      libgtk-3-0 \
      libxshmfence1 \
      libasound2t64 || sudo apt-get install -y liboss4-salsa-asound2
  displayName: 'Install Chromium dependencies for ReactSnap'

- script: |
    echo "===== SYSTEM INFO ====="
    node -v
    npm -v
    echo "Current Directory: $(pwd)"
    echo "Working Directory: $(System.DefaultWorkingDirectory)"
    echo "Files in Working Directory:"
    ls -la
  displayName: 'Log System Details'

# 🟢 Step 3: Install Dependencies with Logs
- script: |
    echo "===== INSTALLING DEPENDENCIES ====="
    npm ci || npm install
    echo "===== NODE MODULES INSTALLED SUCCESSFULLY ====="
  displayName: 'Install Dependencies'
  continueOnError: false

# 🟢 Step 4: Build React App (staging)
- script: |
    echo "===== STARTING BUILD (staging) ====="
    set -o pipefail
    npm run build:staging --verbose 2>&1 | tee build.log
    STATUS=${PIPESTATUS[0]}
    echo "Build Exit Code: $STATUS"
    if [ $STATUS -ne 0 ]; then
      echo "❌ BUILD FAILED — CHECK build.log FOR DETAILS"
      cat build.log
      exit $STATUS
    fi
  displayName: 'Build React App (staging)'

# 🟢 Step 5: Verify Build Output
- script: |
    echo "===== VERIFYING BUILD DIRECTORY ====="
    if [ -d "$(System.DefaultWorkingDirectory)/build" ]; then
      echo "✅ Build directory exists. Contents:"
      ls -la "$(System.DefaultWorkingDirectory)/build"
    else
      echo "❌ Build directory not found!"
      exit 1
    fi
  displayName: 'Verify Build Folder Exists'

- task: AzureCLI@2
  displayName: 'Upload to Azure Blob Storage (account key auth)'
  inputs:
    azureSubscription: 'Credstage'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      SOURCE_DIR="$(System.DefaultWorkingDirectory)/build"

      echo "===== STARTING AZURE UPLOAD ====="
      echo "Source Directory: $SOURCE_DIR"
      echo "Listing files before upload..."
      ls -la "$SOURCE_DIR"

      if [ ! -d "$SOURCE_DIR" ]; then
        echo "❌ Build directory not found: $SOURCE_DIR"
        exit 1
      fi

      echo "===== UPLOADING TO AZURE STORAGE ====="
      az storage blob upload-batch \
        --account-name credstagestorage \
        --account-key "vd2v+WLAF+PjRlpCc7sazjcJCeeDJiSpsg2Im/ijm+yZwzOPhOua+oDxG5uBjokxROxVTJQzzCQR+AStwtpWeg==" \
        --destination '$web' \
        --source "$SOURCE_DIR" \
        --overwrite true || {
          echo "❌ UPLOAD FAILED. CHECK AZURE CREDENTIALS OR CONNECTION."
          exit 1
        }

      echo "✅ UPLOAD COMPLETED SUCCESSFULLY!" 
